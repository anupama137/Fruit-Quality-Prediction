
<!DOCTYPE html>
<html>
<head>
    <title>Fruit Quality Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Fruit Quality Prediction</h1>
        <form action="/predict" method="POST">
            Firmness: <input type="number" step="0.1" name="firmness" required><br>
            Color Score: <input type="number" step="0.1" name="color" required><br>
            Sugar Level: <input type="number" step="0.1" name="sugar" required><br>
            Spots Percentage: <input type="number" name="spots" required><br>
            Days After Harvest: <input type="number" name="days" required><br>
            <button type="submit">Predict</button>
        </form>

        {% if prediction %}
            <h2>Result: {{ prediction }}</h2>
        {% endif %}
    </div>
</body>
</html>
